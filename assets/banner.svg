<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Dark Tech Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070A10"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>

    <!-- Accent Pulsing Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .bg-grid { fill: url(#grid); }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#title-grad); }
    .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94A3B8; letter-spacing: 0.5px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #38BDF8; }
    
    /* Dynamic Animations */
    @keyframes wave {
      0% { transform: translateX(0px); }
      50% { transform: translateX(-40px); }
      100% { transform: translateX(0px); }
    }
    @keyframes pulse-node {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.15); }
    }
    @keyframes signal-flow {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    
    .animated-wave-1 { animation: wave 12s ease-in-out infinite; }
    .animated-wave-2 { animation: wave 8s ease-in-out infinite reverse; }
    .node-pulse { animation: pulse-node 4s ease-in-out infinite; transform-origin: center; }
    .flow-line { stroke-dasharray: 12, 12; animation: signal-flow 6s linear infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>
  <rect width="100%" height="100%" class="bg-grid"/>

  <!-- Dynamic / Animated Background Graphics (Behind Text) -->
  <g opacity="0.25">
    <!-- Signal Waveform 1 -->
    <path class="animated-wave-1" d="M -100 280 Q 200 180 500 280 T 1100 280 T 1700 280" fill="none" stroke="#0284C7" stroke-width="2"/>
    <!-- Signal Waveform 2 -->
    <path class="animated-wave-2" d="M -100 320 Q 300 220 700 320 T 1500 320" fill="none" stroke="#6366F1" stroke-width="1.5"/>
    
    <!-- Real-time Streaming Nodes -->
    <circle cx="150" cy="120" r="4" fill="#38BDF8" class="node-pulse"/>
    <circle cx="1050" cy="140" r="5" fill="#818CF8" class="node-pulse"/>
    <circle cx="980" cy="310" r="4" fill="#C084FC" class="node-pulse"/>
  </g>

  <!-- Decorative Tech Header Bar -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#title-grad)"/>

  <!-- Live Latency Indicator Pill (Background decorative, positioned carefully away from title) -->
  <g transform="translate(80, 65)">
    <rect width="190" height="32" rx="16" fill="rgba(14, 165, 233, 0.12)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="16" r="5" fill="#22C55E" filter="url(#subtle-glow)"/>
    <text x="35" y="21" class="badge-text">⚡ SUB-SECOND LATENCY</text>
  </g>

  <!-- FOREGROUND TEXT BLOCK (Guaranteed clear visibility & high contrast) -->
  <g transform="translate(80, 160)">
    <!-- Main Title -->
    <text x="0" y="0" class="title-text" filter="url(#glow)">Awesome Low-Latency Live Streaming</text>
    
    <!-- Dynamic Separator Line -->
    <rect x="0" y="22" width="640" height="3" rx="1.5" fill="url(#line-grad)"/>
    
    <!-- Subtitle -->
    <text x="0" y="65" class="subtitle-text">Curated Ecosystem of Media Servers, WebRTC Platforms &amp; Live Video SDKs</text>
  </g>

  <!-- Bottom Tech Tags / Protocol Chips -->
  <g transform="translate(80, 310)">
    <!-- WebRTC Chip -->
    <g transform="translate(0, 0)">
      <rect width="90" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="45" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">WebRTC</text>
    </g>
    <!-- LL-HLS Chip -->
    <g transform="translate(102, 0)">
      <rect width="85" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="42.5" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#818CF8" text-anchor="middle">LL-HLS</text>
    </g>
    <!-- SRT Chip -->
    <g transform="translate(199, 0)">
      <rect width="65" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="32.5" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#C084FC" text-anchor="middle">SRT</text>
    </g>
    <!-- RTMP Chip -->
    <g transform="translate(276, 0)">
      <rect width="75" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="37.5" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#F472B6" text-anchor="middle">RTMP</text>
    </g>
    <!-- Media-over-QUIC Chip -->
    <g transform="translate(363, 0)">
      <rect width="145" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="72.5" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#34D399" text-anchor="middle">Media-over-QUIC</text>
    </g>
  </g>
</svg>
